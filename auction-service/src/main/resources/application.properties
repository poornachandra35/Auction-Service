# =====================================================
# SERVER CONFIG
# =====================================================

server.port=8084

# =====================================================
# APPLICATION NAME
# =====================================================

spring.application.name=auction-service

# =====================================================
# MYSQL DATABASE CONFIG
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/auction_dashboard
spring.datasource.username=root
spring.datasource.password=your_password

# =====================================================
# JPA / HIBERNATE CONFIG
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =====================================================
# EUREKA CONFIG
# =====================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# =====================================================
# LOGGING CONFIG
# =====================================================

logging.level.root=INFO
logging.level.com.auction=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG


# =====================================================
# FILE LOGGING
# =====================================================

logging.file.name=logs/auction-service.log

# LOG ROTATION

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=200MB

# =====================================================
# RESILIENCE4J CIRCUIT BREAKER
# =====================================================

resilience4j.circuitbreaker.instances.notificationService.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=5

resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=50

resilience4j.circuitbreaker.instances.notificationService.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.notificationService.permittedNumberOfCallsInHalfOpenState=2

# =====================================================
# ACTUATOR CONFIG
# =====================================================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Correlation-Id}] %-5level %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Correlation-Id}] %-5level %logger{36} - %msg%n