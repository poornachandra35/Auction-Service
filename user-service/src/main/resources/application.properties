server.port=8081

spring.application.name=USER-SERVICE

spring.datasource.url=jdbc:mysql://localhost:3306/auction_db
spring.datasource.username=root
spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
jwt.secret=MySuperSecretKeyForJWT1234567890
jwt.expiration=86400000




eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ---------- Circuit Breaker ----------
resilience4j.circuitbreaker.instances.notificationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notificationService.wait-duration-in-open-state=10s

# ---------- Retry ----------
resilience4j.retry.instances.notificationService.max-attempts=3
resilience4j.retry.instances.notificationService.wait-duration=2s

# =====================================================
# LOGGING
# =====================================================

logging.level.root=INFO
logging.level.com.auction.userservice=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Correlation-Id}] %-5level %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Correlation-Id}] %-5level %logger{36} - %msg%n

logging.file.name=logs/user-service.log

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=200MB

# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always