server.port=8081

spring.application.name=USER-SERVICE

spring.datasource.url=jdbc:mysql://localhost:3306/auction_db
spring.datasource.username=root
spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
jwt.secret=MySuperSecretKeyForJWT1234567890
jwt.expiration=86400000




eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ---------- Circuit Breaker ----------
resilience4j.circuitbreaker.instances.notificationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notificationService.wait-duration-in-open-state=10s

# ---------- Retry ----------
resilience4j.retry.instances.notificationService.max-attempts=3
resilience4j.retry.instances.notificationService.wait-duration=2s