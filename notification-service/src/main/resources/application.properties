# =====================================================
# SERVER
# =====================================================

server.port=8083

# =====================================================
# APPLICATION NAME
# =====================================================

spring.application.name=notification-service

# =====================================================
# EUREKA
# =====================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# =====================================================
# MAILJET
# =====================================================

mailjet.api-key=YOUR_API_KEY
mailjet.secret-key=YOUR_SECRET_KEY

# =====================================================
# LOGGING
# =====================================================

logging.level.root=INFO
logging.level.com.auction.notification_service=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Correlation-Id}] %-5level %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Correlation-Id}] %-5level %logger{36} - %msg%n
logging.file.name=logs/notification-service.log

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=200MB

# =====================================================
# RESILIENCE4J CIRCUIT BREAKER
# =====================================================

resilience4j.circuitbreaker.instances.emailService.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.emailService.slidingWindowSize=5

resilience4j.circuitbreaker.instances.emailService.minimumNumberOfCalls=3

resilience4j.circuitbreaker.instances.emailService.failureRateThreshold=50

resilience4j.circuitbreaker.instances.emailService.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.emailService.permittedNumberOfCallsInHalfOpenState=2

# =====================================================
# RETRY
# =====================================================

resilience4j.retry.instances.emailService.maxAttempts=3

resilience4j.retry.instances.emailService.waitDuration=2s

# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always