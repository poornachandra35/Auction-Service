# =====================================================
# SERVER CONFIG
# =====================================================

server.port=8082

# =====================================================
# APPLICATION NAME
# =====================================================

spring.application.name=item-service

# =====================================================
# MYSQL DATABASE CONFIG
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/item_db
spring.datasource.username=root
spring.datasource.password=your_password

# =====================================================
# JPA / HIBERNATE CONFIG
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =====================================================
# FILE UPLOAD CONFIG
# =====================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# EUREKA CONFIG
# =====================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# =====================================================
# LOGGING CONFIG
# =====================================================

logging.level.root=INFO
logging.level.com.auction.itemservice=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Correlation-Id}] %-5level %logger{36} - %msg%n

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Correlation-Id}] %-5level %logger{36} - %msg%n


# =====================================================
# RESILIENCE4J CIRCUIT BREAKER
# =====================================================

resilience4j.circuitbreaker.instances.auctionService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.auctionService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.auctionService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.auctionService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.auctionService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.auctionService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.auctionService.automaticTransitionFromOpenToHalfOpenEnabled=true

# =====================================================
# NOTIFICATION CIRCUIT BREAKER
# =====================================================

resilience4j.circuitbreaker.instances.notificationService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.notificationService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=50

# =====================================================
# RETRY CONFIG
# =====================================================

resilience4j.retry.instances.auctionService.maxAttempts=3
resilience4j.retry.instances.auctionService.waitDuration=2s

resilience4j.retry.instances.notificationService.maxAttempts=3
resilience4j.retry.instances.notificationService.waitDuration=1s

# =====================================================
# ACTUATOR CONFIG
# =====================================================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# =====================================================
# FILE LOGGING
# =====================================================

logging.file.name=logs/item-service.log

# =====================================================
# LOG FORMAT
# =====================================================






